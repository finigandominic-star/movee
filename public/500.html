<!doctype html>
<html lang="en-GB">
  <head>
    <title>Something went wrong | Moveee</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/icon.png" type="image/png">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }
      body {
        background: #EEF5FA;
        color: #1B1B3A;
        display: grid;
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
        min-height: 100dvh;
        padding: 1rem;
        place-items: center;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        background: #FFF;
        border: 1px solid #DDE3EE;
        border-radius: 1rem;
        box-shadow: 0 8px 30px rgba(33, 33, 97, 0.08);
        max-width: 32rem;
        overflow: hidden;
        text-align: center;
        width: 100%;
      }
      .card__top { background: #212161; padding: 1.5rem; }
      .card__top img { border-radius: 0.75rem; height: 64px; width: 64px; }
      .card__body { padding: 2rem 1.5rem 2.25rem; }
      .code { color: #4750DD; font-size: 4.5rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
      h1 { color: #212161; font-size: 1.5rem; font-weight: 800; margin: 0.75rem 0 0.5rem; }
      p { color: #5E6178; margin-bottom: 1.5rem; }
      .btn {
        background: #BCFB89;
        border-radius: 0.5rem;
        color: #212161;
        display: inline-block;
        font-weight: 700;
        padding: 0.7rem 1.5rem;
        text-decoration: none;
      }
      .btn:hover, .btn:focus { background: #a9f06f; }
      .btn:focus-visible { outline: 3px solid #4750DD; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="card__top"><img src="/icon.png" alt="Moveee"></div>
      <div class="card__body">
        <div class="code">500</div>
        <h1>Something went wrong on our side</h1>
        <p>We've hit an unexpected problem. Please try again in a moment. If it keeps happening, let us know.</p>
        <a class="btn" href="/">Back to Moveee</a>
      </div>
    </main>
  </body>
</html>
